<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Planner · Bathroom</title>
<style>
  :root {
    --bg: #fbfbfd;
    --surface: #ffffff;
    --ink: #1d1d1f;
    --ink-muted: #6e6e73;
    --hairline: #d2d2d7;
    --hairline-soft: #e8e8ed;
    --accent: #0071e3;
    --tile-empty: #f5f5f7;
    --grout: #e5e5ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    display: flex;
    min-height: 100vh;
  }

  aside {
    width: 280px;
    flex-shrink: 0;
    padding: 40px 28px;
    background: var(--surface);
    border-right: 1px solid var(--hairline-soft);
    display: flex;
    flex-direction: column;
    gap: 36px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  aside h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  aside .sub {
    font-size: 13px;
    color: var(--ink-muted);
  }
  aside section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  aside h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .field label { font-size: 13px; color: var(--ink); }
  .field input[type="number"] {
    width: 70px;
    padding: 7px 10px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    text-align: right;
    background: #fff;
    outline: none;
  }
  .field input[type="number"]:focus { border-color: var(--accent); }

  .swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,.08);
    cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease;
    position: relative;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active {
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  }
  .swatch .remove {
    position: absolute;
    top: -5px; right: -5px;
    width: 16px; height: 16px;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    color: var(--ink-muted);
    cursor: pointer;
  }
  .swatch:hover .remove { display: flex; }
  .add-color {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px dashed var(--hairline);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    font-size: 16px;
    line-height: 1;
    padding: 0;
  }
  .add-color:hover { border-color: var(--accent); color: var(--accent); }

  .tools {
    display: flex;
    gap: 6px;
    flex-direction: column;
  }
  .tool-btn {
    padding: 8px 12px;
    border: 1px solid var(--hairline-soft);
    background: #fff;
    border-radius: 8px;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--ink);
  }
  .tool-btn:hover { background: #f5f5f7; }
  .tool-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #fff;
  }
  .tool-btn .kbd {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-muted);
    border: 1px solid var(--hairline);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "SF Mono", Menlo, monospace;
  }

  .count-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .count-chip {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.08);
    flex-shrink: 0;
  }
  .count-label {
    flex: 1;
    color: var(--ink-muted);
    font-size: 12px;
    font-family: "SF Mono", Menlo, monospace;
  }
  .count-num {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink);
  }
  .count-empty {
    font-size: 12px;
    color: var(--ink-muted);
    padding: 4px 0;
  }
  .count-total {
    margin-top: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline-soft);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 500;
  }
  .count-total span:last-child {
    font-variant-numeric: tabular-nums;
  }

  .io-row { display: flex; gap: 6px; }
  .io-btn {
    flex: 1;
    padding: 8px;
    border: 1px solid var(--hairline);
    background: #fff;
    border-radius: 8px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    color: var(--ink);
  }
  .io-btn:hover { background: #f5f5f7; }

  main {
    flex: 1;
    padding: 48px 56px 96px;
    overflow: auto;
    min-width: 0;
  }
  .canvas-header {
    margin-bottom: 40px;
  }
  .canvas-header h2 {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .canvas-header p {
    font-size: 13px;
    color: var(--ink-muted);
    max-width: 60ch;
  }
  code {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 12px;
    background: #f5f5f7;
    padding: 1px 5px;
    border-radius: 4px;
  }

  .group {
    margin-bottom: 56px;
  }
  .group-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .group-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .group-rule {
    flex: 1;
    height: 1px;
    background: var(--hairline-soft);
  }

  .surfaces {
    display: flex;
    flex-wrap: wrap;
    gap: 36px;
    align-items: flex-start;
  }
  .surface {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .surface-name {
    font-size: 13px;
    font-weight: 500;
  }
  .surface-meta {
    font-size: 11px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", Menlo, monospace;
  }
  .grid {
    display: grid;
    background: var(--grout);
    padding: 1px;
    gap: 1px;
    border-radius: 2px;
    user-select: none;
  }
  .tile {
    background: var(--tile-empty);
    cursor: crosshair;
    transition: background .05s ease;
  }
  .tile:hover {
    outline: 1.5px solid var(--accent);
    outline-offset: -1.5px;
    z-index: 1;
    position: relative;
  }
</style>
</head>
<body>

<aside>
  <div>
    <h1>Tile Planner</h1>
    <div class="sub">7.87″ × 7.87″ tiles · bathroom</div>
  </div>

  <section>
    <h2>Room</h2>
    <div class="field">
      <label for="ceil">Ceiling height</label>
      <div><input type="number" id="ceil" value="9" step="0.5" min="7" max="14"> <span class="sub">ft</span></div>
    </div>
  </section>

  <section>
    <h2>Palette</h2>
    <div class="swatches" id="swatches"></div>
  </section>

  <section>
    <h2>Tool</h2>
    <div class="tools">
      <button class="tool-btn active" data-tool="paint">
        <span>Paint</span>
        <span class="kbd">click</span>
      </button>
      <button class="tool-btn" data-tool="eyedrop">
        <span>Eyedrop</span>
        <span class="kbd">⇧</span>
      </button>
      <button class="tool-btn" data-tool="erase">
        <span>Erase</span>
        <span class="kbd">⌥</span>
      </button>
    </div>
  </section>

  <section>
    <h2>Tile counts</h2>
    <div id="counts"></div>
    <div class="count-total">
      <span>Total</span>
      <span id="total">—</span>
    </div>
  </section>

  <section>
    <h2>File</h2>
    <div class="io-row">
      <button class="io-btn" id="save">Save</button>
      <button class="io-btn" id="load">Load</button>
      <button class="io-btn" id="reset">Reset</button>
    </div>
  </section>
</aside>

<main>
  <div class="canvas-header">
    <h2>Every surface.</h2>
    <p>Click or drag to paint. Hold <code>shift</code> to pick a color from an existing tile. Hold <code>option</code> to erase. Your layout saves automatically.</p>
  </div>

  <div id="canvas"></div>
</main>

<script>
(() => {
  'use strict';

  const TILE_INCH = 7.87;
  const TILE_PX = 18;
  const SQ_IN_PER_TILE = TILE_INCH * TILE_INCH;

  const DEFAULT_PALETTE = [
    '#ffffff', '#f5f5f7', '#d2d2d7', '#86868b', '#1d1d1f', '#000000',
    '#b85450', '#3a5a7a'
  ];

  // Grid dimensions chosen to match the square-footage the user provided,
  // using aspect ratios drawn from the floor plan where we have one.
  // ft² ≈ cols * rows * 61.94 / 144
  function buildSurfaces(ceilFt) {
    const wallRows = Math.round(ceilFt * 12 / TILE_INCH);
    return [
      { id: 'main',    group: 'Floors',  name: 'Main bath floor', cols: 21, rows: 9,  dims: `13'9" × 5'11"` },
      { id: 'ensuite', group: 'Floors',  name: 'En suite floor',  cols: 12, rows: 9,  dims: `7'10" × 5'11"` },
      { id: 'shower',  group: 'Floors',  name: 'Shower floor',    cols: 11, rows: 5,  dims: `7'3" × 3'3"` },
      { id: 'ceiling', group: 'Ceiling', name: 'Ceiling',         cols: 21, rows: 17, dims: `combined rooms` },
      { id: 'wallN',   group: 'Walls',   name: 'North wall',      cols: 22, rows: wallRows, dims: `14'5" × ${ceilFt}'` },
      { id: 'wallS',   group: 'Walls',   name: 'South wall',      cols: 22, rows: wallRows, dims: `14'5" × ${ceilFt}'` },
      { id: 'wallE',   group: 'Walls',   name: 'East wall',       cols: 10, rows: wallRows, dims: `6'7" × ${ceilFt}'` },
      { id: 'wallW',   group: 'Walls',   name: 'West wall',       cols: 10, rows: wallRows, dims: `6'7" × ${ceilFt}'` },
    ];
  }

  const state = {
    ceilFt: 9,
    palette: [...DEFAULT_PALETTE],
    selectedColor: DEFAULT_PALETTE[4],
    tool: 'paint',
    surfaces: [],
    tiles: {},
  };

  function initTiles(surfaces, prev = {}) {
    const tiles = {};
    for (const s of surfaces) {
      const len = s.cols * s.rows;
      const arr = new Array(len).fill(null);
      if (prev[s.id]) {
        const plen = prev[s.id].length;
        for (let i = 0; i < Math.min(len, plen); i++) arr[i] = prev[s.id][i];
      }
      tiles[s.id] = arr;
    }
    return tiles;
  }

  function loadSaved() {
    try {
      const raw = localStorage.getItem('tilePlanner.v1');
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) { return null; }
  }

  function persist() {
    try {
      localStorage.setItem('tilePlanner.v1', JSON.stringify({
        ceilFt: state.ceilFt,
        palette: state.palette,
        selectedColor: state.selectedColor,
        tiles: state.tiles,
      }));
    } catch (e) {}
  }

  const saved = loadSaved();
  if (saved) {
    if (typeof saved.ceilFt === 'number') state.ceilFt = saved.ceilFt;
    if (Array.isArray(saved.palette) && saved.palette.length) state.palette = saved.palette;
    if (saved.selectedColor) state.selectedColor = saved.selectedColor;
  }
  state.surfaces = buildSurfaces(state.ceilFt);
  state.tiles = initTiles(state.surfaces, saved?.tiles || {});

  const $ = (s) => document.querySelector(s);
  const canvas = $('#canvas');
  const swatchesEl = $('#swatches');
  const countsEl = $('#counts');
  const totalEl = $('#total');
  const ceilInput = $('#ceil');
  ceilInput.value = state.ceilFt;

  function areaFt2(cols, rows) {
    return (cols * rows * SQ_IN_PER_TILE) / 144;
  }

  function renderSwatches() {
    swatchesEl.innerHTML = '';
    for (const color of state.palette) {
      const sw = document.createElement('button');
      sw.className = 'swatch' + (color === state.selectedColor ? ' active' : '');
      sw.style.background = color;
      sw.title = color;
      sw.addEventListener('click', () => {
        state.selectedColor = color;
        renderSwatches();
        persist();
      });
      const rm = document.createElement('span');
      rm.className = 'remove';
      rm.textContent = '×';
      rm.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.palette.length <= 1) return;
        state.palette = state.palette.filter((c) => c !== color);
        if (state.selectedColor === color) state.selectedColor = state.palette[0];
        renderSwatches();
        persist();
      });
      sw.appendChild(rm);
      swatchesEl.appendChild(sw);
    }
    const add = document.createElement('button');
    add.className = 'add-color';
    add.textContent = '+';
    add.title = 'Add color';
    add.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'color';
      input.value = '#888888';
      input.addEventListener('change', () => {
        if (!state.palette.includes(input.value)) state.palette.push(input.value);
        state.selectedColor = input.value;
        renderSwatches();
        persist();
      });
      input.click();
    });
    swatchesEl.appendChild(add);
  }

  function renderCanvas() {
    canvas.innerHTML = '';
    const groups = new Map();
    for (const s of state.surfaces) {
      if (!groups.has(s.group)) groups.set(s.group, []);
      groups.get(s.group).push(s);
    }
    for (const [gname, gsurf] of groups) {
      const gEl = document.createElement('div');
      gEl.className = 'group';
      const head = document.createElement('div');
      head.className = 'group-head';
      head.innerHTML = `<span class="group-title">${gname}</span><span class="group-rule"></span>`;
      gEl.appendChild(head);
      const surfs = document.createElement('div');
      surfs.className = 'surfaces';
      for (const s of gsurf) {
        const area = areaFt2(s.cols, s.rows).toFixed(1);
        const surf = document.createElement('div');
        surf.className = 'surface';
        surf.innerHTML = `
          <div>
            <div class="surface-name">${s.name}</div>
            <div class="surface-meta">${s.cols}×${s.rows} · ${s.cols * s.rows} tiles · ${area} ft² · ${s.dims}</div>
          </div>
        `;
        const grid = document.createElement('div');
        grid.className = 'grid';
        grid.style.gridTemplateColumns = `repeat(${s.cols}, ${TILE_PX}px)`;
        grid.style.gridTemplateRows = `repeat(${s.rows}, ${TILE_PX}px)`;
        for (let i = 0; i < s.cols * s.rows; i++) {
          const t = document.createElement('div');
          t.className = 'tile';
          t.dataset.surfaceId = s.id;
          t.dataset.idx = i;
          const c = state.tiles[s.id][i];
          if (c) t.style.background = c;
          grid.appendChild(t);
        }
        surf.appendChild(grid);
        surfs.appendChild(surf);
      }
      gEl.appendChild(surfs);
      canvas.appendChild(gEl);
    }
  }

  function renderCounts() {
    const counts = new Map();
    let total = 0;
    for (const s of state.surfaces) {
      for (const c of state.tiles[s.id]) {
        total++;
        if (c) counts.set(c, (counts.get(c) || 0) + 1);
      }
    }
    countsEl.innerHTML = '';
    if (counts.size === 0) {
      const d = document.createElement('div');
      d.className = 'count-empty';
      d.textContent = 'No tiles painted yet.';
      countsEl.appendChild(d);
    } else {
      const sorted = [...counts.entries()].sort((a, b) => b[1] - a[1]);
      for (const [color, n] of sorted) {
        const row = document.createElement('div');
        row.className = 'count-row';
        row.innerHTML = `
          <span class="count-chip" style="background:${color}"></span>
          <span class="count-label">${color}</span>
          <span class="count-num">${n.toLocaleString()}</span>
        `;
        countsEl.appendChild(row);
      }
    }
    totalEl.textContent = total.toLocaleString();
  }

  function effectiveTool(e) {
    if (e.altKey) return 'erase';
    if (e.shiftKey) return 'eyedrop';
    return state.tool;
  }

  function setTile(surfaceId, idx, color) {
    state.tiles[surfaceId][idx] = color;
    const el = canvas.querySelector(`.tile[data-surface-id="${surfaceId}"][data-idx="${idx}"]`);
    if (el) el.style.background = color || '';
  }

  function tileFromEvent(e) {
    const el = e.target.closest('.tile');
    if (!el) return null;
    return { surfaceId: el.dataset.surfaceId, idx: +el.dataset.idx };
  }

  function apply(target, e) {
    if (!target) return;
    const tool = effectiveTool(e);
    if (tool === 'paint') setTile(target.surfaceId, target.idx, state.selectedColor);
    else if (tool === 'erase') setTile(target.surfaceId, target.idx, null);
    else if (tool === 'eyedrop') {
      const c = state.tiles[target.surfaceId][target.idx];
      if (c) {
        state.selectedColor = c;
        if (!state.palette.includes(c)) state.palette.push(c);
        renderSwatches();
      }
    }
  }

  let painting = false;
  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    const t = tileFromEvent(e);
    if (!t) return;
    painting = true;
    apply(t, e);
    renderCounts();
  });
  canvas.addEventListener('mouseover', (e) => {
    if (!painting) return;
    const t = tileFromEvent(e);
    if (!t) return;
    apply(t, e);
  });
  window.addEventListener('mouseup', () => {
    if (painting) {
      painting = false;
      renderCounts();
      persist();
    }
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.querySelectorAll('.tool-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.tool = btn.dataset.tool;
      document.querySelectorAll('.tool-btn').forEach((b) => b.classList.toggle('active', b === btn));
    });
  });

  ceilInput.addEventListener('change', () => {
    const v = parseFloat(ceilInput.value);
    if (!isFinite(v) || v < 4 || v > 20) {
      ceilInput.value = state.ceilFt;
      return;
    }
    state.ceilFt = v;
    const prev = state.tiles;
    state.surfaces = buildSurfaces(v);
    state.tiles = initTiles(state.surfaces, prev);
    renderCanvas();
    renderCounts();
    persist();
  });

  $('#save').addEventListener('click', () => {
    const data = {
      ceilFt: state.ceilFt,
      palette: state.palette,
      selectedColor: state.selectedColor,
      tiles: state.tiles,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bathroom-tiles.json';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $('#load').addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json';
    input.addEventListener('change', () => {
      const f = input.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (typeof d.ceilFt === 'number') state.ceilFt = d.ceilFt;
          if (Array.isArray(d.palette) && d.palette.length) state.palette = d.palette;
          if (d.selectedColor) state.selectedColor = d.selectedColor;
          state.surfaces = buildSurfaces(state.ceilFt);
          state.tiles = initTiles(state.surfaces, d.tiles || {});
          ceilInput.value = state.ceilFt;
          renderSwatches();
          renderCanvas();
          renderCounts();
          persist();
        } catch (err) {
          alert('Could not load: ' + err.message);
        }
      };
      r.readAsText(f);
    });
    input.click();
  });

  $('#reset').addEventListener('click', () => {
    if (!confirm('Clear every painted tile?')) return;
    state.tiles = initTiles(state.surfaces);
    renderCanvas();
    renderCounts();
    persist();
  });

  renderSwatches();
  renderCanvas();
  renderCounts();
})();
</script>
</body>
</html>
